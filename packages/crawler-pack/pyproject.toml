[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oeds-crawler-pack"
version = "1.5.0"
description = "Installable KIT crawler extensions for Open Energy Data Server."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-or-later"
dependencies = [
    "cdsapi",
    "cfgrib",
    "eccodes",
    "entsoe-py",
    "eurostat",
    "lxml",
    "netCDF4",
    "oeds[crawlers]",
    "openpyxl",
    "pandas",
    "paramiko",
    "psycopg2-binary",
    "python-dotenv",
    "pyyaml",
    "requests",
    "sqlalchemy",
    "xarray",
]

[project.scripts]
oeds-crawl = "crawler.cli:main"

[project.entry-points."oeds.crawlers"]
smard = "crawler.smard:SmardCrawler"
eurostat = "crawler.eurostat:EurostatCrawler"
copernicus_cds = "crawler.copernicus_cds:CopernicusCdsCrawler"
dwd_cdc = "crawler.dwd_cdc:DwdCdcCrawler"
eia = "crawler.eia:EiaCrawler"
energyforecast = "crawler.energyforecast:EnergyForecastCrawler"
entsoe_api = "crawler.entsoe_api:EntsoeApiCrawler"
entsoe_files = "crawler.entsoe_files:EntsoeFilesCrawler"
entsog = "crawler.entsog:EntsogCrawler"
epex_spot = "crawler.epex_spot:EpexSpotCrawler"
gie_agsi_alsi = "crawler.gie_agsi_alsi:GieAgsiAlsiCrawler"
mastr = "crawler.mastr:MastrCrawler"
netztransparenz = "crawler.netztransparenz:NetztransparenzCrawler"
renewables_ninja = "crawler.renewables_ninja:RenewablesNinjaCrawler"
open_meteo = "crawler.open_meteo:OpenMeteoCrawler"
powerplantmatching = "crawler.powerplantmatching:PowerplantmatchingCrawler"
prisma_capacity = "crawler.prisma_capacity:PrismaCapacityCrawler"
regelleistung = "crawler.regelleistung:RegelleistungCrawler"
tradinghub = "crawler.tradinghub:TradingHubCrawler"
tyndp_pecd = "crawler.tyndp_pecd:TyndpPecdCrawler"
pypsa_technology_data = "crawler.pypsa_technology_data:PypsaTechnologyDataCrawler"
worldbank_commodities = "crawler.worldbank_commodities:WorldbankCommoditiesCrawler"
eex_eua_auctions = "crawler.eex_eua_auctions:EexEuaAuctionsCrawler"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crawler = [".env.example", "data/*.json"]
