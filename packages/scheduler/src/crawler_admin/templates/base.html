<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}OEDS Crawler Control{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('admin_static', path='admin.css') }}" />
    <link rel="stylesheet" href="{{ url_for('admin_static', path='ui.css') }}" />
  </head>
  <body class="ui">
    <header class="appbar">
      <a href="/admin" class="appbar__brand"><strong>OEDS</strong><span>Crawler control</span></a>
      <nav class="appbar__nav" aria-label="Primary">
        <a href="/admin" {% if page_name in ('dashboard', 'crawler_detail') %}aria-current="page"{% endif %}>Crawlers</a>
        <a href="/admin/editor" {% if page_name == 'editor' %}aria-current="page"{% endif %}>Configuration</a>
      </nav>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
