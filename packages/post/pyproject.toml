[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oeds-post-scripts"
version = "1.1.0"
description = "Post-run processing CLI for Open Energy Data Server."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-or-later"
dependencies = [
    "numpy",
    "pandas",
    "psycopg2-binary",
    "python-dotenv",
    "pyyaml",
    "sqlalchemy",
]

[project.optional-dependencies]
# `oeds-post backfill entsoe-unavailability` imports the pack's ENTSO-E FMS crawler.
backfill = ["oeds-crawler-pack"]
# da-price-forecasting imports scikit-learn and scipy without declaring them.
price-forecast = [
    "da-price-forecasting @ git+https://github.com/philipprisk/DA_Price_Forecasting_Pipeline_DE_LU.git@c3f8a270cbeff328a30609f9b66e96ced693b676",
    "holidays",
    "matplotlib",
    "scikit-learn",
    "scipy",
]

[project.scripts]
oeds-post = "oeds_post_scripts.cli:main"

[tool.setuptools]
packages = [
    "oeds_post_scripts",
    "oeds_gapfill",
    "oeds_price_forecast",
    "scripts",
    "scripts.lib",
]
package-dir = {oeds_post_scripts = "src/oeds_post_scripts", oeds_gapfill = "oeds_gapfill", oeds_price_forecast = "oeds_price_forecast", scripts = "scripts", "scripts.lib" = "scripts/lib"}

[tool.setuptools.package-data]
"scripts.lib" = ["*.sql"]
