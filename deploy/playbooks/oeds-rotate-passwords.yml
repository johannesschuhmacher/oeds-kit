---
- name: Rotate OEDS service passwords
  hosts: oeds
  become: true
  serial: 1
  vars:
    oeds_default_root: /open_energy_data_server
    oeds_default_repo_dir: "{{ oeds_default_root }}/repo"
    oeds_root_effective: "{{ oeds_root | default(oeds_default_root) }}"
    oeds_repo_dir_effective: "{{ oeds_repo_dir | default(oeds_root_effective ~ '/repo') }}"
    oeds_compose_dir_effective: "{{ oeds_compose_dir | default(oeds_repo_dir_effective ~ '/modular_repos/modules/oeds-deployment') }}"
    oeds_rotation_deployment_name_effective: >-
      {{ oeds_rotation_deployment_name | default(inventory_hostname) }}
    oeds_rotation_access_host_effective: >-
      {{ oeds_rotation_access_host | default(ansible_host | default(inventory_hostname)) }}
    oeds_rotation_bitwarden_folder_effective: >-
      {{ oeds_rotation_bitwarden_folder | default('OEDS/' ~ oeds_rotation_deployment_name_effective) }}
    oeds_rotation_password_length_effective: >-
      {{ oeds_rotation_password_length | default(32) }}
    oeds_rotation_dry_run_effective: >-
      {{ oeds_rotation_dry_run | default(false) | bool }}
    oeds_rotation_python_effective: >-
      {{ ansible_python_interpreter | default('/usr/bin/python3') }}
  tasks:
  - name: Check required Bitwarden environment variables on the control node
    ansible.builtin.assert:
      that:
        - lookup('ansible.builtin.env', 'BW_CLIENTID') | length > 0
        - lookup('ansible.builtin.env', 'BW_CLIENTSECRET') | length > 0
        - lookup('ansible.builtin.env', 'BW_PASSWORD') | length > 0
      fail_msg: >-
        Set BW_CLIENTID, BW_CLIENTSECRET, and BW_PASSWORD in the control-node
        environment before running this playbook.
    delegate_to: localhost
    run_once: true
    no_log: true
    when: not oeds_rotation_dry_run_effective

  - name: Check that the deployed repository exists
    ansible.builtin.stat:
      path: "{{ oeds_repo_dir_effective }}"
    register: oeds_repo_stat

  - name: Fail when the deployed repository is missing
    ansible.builtin.fail:
      msg: >-
        Expected an OEDS checkout at {{ oeds_repo_dir_effective }} on
        {{ inventory_hostname }}. Install or update the host first.
    when: not oeds_repo_stat.stat.exists or not oeds_repo_stat.stat.isdir

  - name: Check that the compose environment file exists
    ansible.builtin.stat:
      path: "{{ oeds_compose_dir_effective }}/.env"
    register: oeds_compose_env_stat

  - name: Fail when the compose environment file is missing
    ansible.builtin.fail:
      msg: >-
        Expected {{ oeds_repo_dir_effective }}/.env on {{ inventory_hostname }}.
        The deployment bootstrap must run before password rotation.
    when: not oeds_compose_env_stat.stat.exists

  - name: Check that the Bitwarden CLI is installed on the target host
    ansible.builtin.command:
      argv:
        - bw
        - --version
    changed_when: false
    when: not oeds_rotation_dry_run_effective

  - name: Check that the Docker CLI is installed on the target host
    ansible.builtin.command:
      argv:
        - docker
        - --version
    changed_when: false

  - name: Build password rotation command
    ansible.builtin.set_fact:
      oeds_rotation_argv: >-
        {{
          [
            oeds_rotation_python_effective,
            oeds_compose_dir_effective ~ '/oeds_ops/password_rotation.py',
            '--compose-env-file',
            oeds_compose_dir_effective ~ '/.env',
            '--deployment-name',
            oeds_rotation_deployment_name_effective,
            '--access-host',
            oeds_rotation_access_host_effective,
            '--bitwarden-folder',
            oeds_rotation_bitwarden_folder_effective,
            '--password-length',
            (oeds_rotation_password_length_effective | string),
          ]
          + (['--dry-run'] if oeds_rotation_dry_run_effective else [])
        }}

  - name: Rotate passwords on the target host
    ansible.builtin.command:
      argv: "{{ oeds_rotation_argv }}"
    args:
      chdir: "{{ oeds_compose_dir_effective }}"
    environment:
      BW_SERVER_URL: "{{ lookup('ansible.builtin.env', 'BW_SERVER_URL') | default('', true) }}"
      BW_CLIENTID: "{{ lookup('ansible.builtin.env', 'BW_CLIENTID') }}"
      BW_CLIENTSECRET: "{{ lookup('ansible.builtin.env', 'BW_CLIENTSECRET') }}"
      BW_PASSWORD: "{{ lookup('ansible.builtin.env', 'BW_PASSWORD') }}"
    register: oeds_rotation_result
    no_log: true

  - name: Report successful rotation
    ansible.builtin.debug:
      msg: >-
        OEDS password rotation completed for {{ inventory_hostname }}
        (deployment {{ oeds_rotation_deployment_name_effective }}).
