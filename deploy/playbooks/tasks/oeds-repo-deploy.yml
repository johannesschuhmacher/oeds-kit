# The new source goes to <repo>.next while the current services keep running
# from <repo>; tasks/oeds-switch-repo.yml swaps the two after the images built.
- name: Remove a staging directory left by an earlier run
  ansible.builtin.file:
    path: "{{ oeds_repo_dir_effective }}.next"
    state: absent

- name: Create the staging directory for the new source
  ansible.builtin.file:
    path: "{{ oeds_repo_dir_effective }}.next"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: oeds_repo_source_mode_effective in ["local_archive", "local_worktree"]

- name: Unpack repo archive from control node
  ansible.builtin.unarchive:
    src: "{{ oeds_repo_archive.path }}"
    dest: "{{ oeds_repo_dir_effective }}.next"
    remote_src: false
    extra_opts:
      - --strip-components=1
  when: oeds_repo_source_mode_effective in ["local_archive", "local_worktree"]

- name: Git checkout requested release
  ansible.builtin.git:
    repo: "{{ oeds_repo_url_effective }}"
    dest: "{{ oeds_repo_dir_effective }}.next"
    version: "{{ oeds_repo_version_effective }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
    GIT_ASKPASS: /bin/false
  when: oeds_repo_source_mode_effective == "git"

- name: Remove temporary repo archive on control node
  ansible.builtin.file:
    path: "{{ oeds_repo_archive.path }}"
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - oeds_repo_source_mode_effective in ["local_archive", "local_worktree"]
    - oeds_repo_archive is defined
