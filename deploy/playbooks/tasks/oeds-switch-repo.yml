# Replace <repo> with the staged <repo>.next once the images are built. The
# old checkout stays as <repo>.prev until the new services are up.
# Imported by oeds-docker-config.yml and oeds-update.yml.

# Recreating the scheduler kills its running crawls after Docker's 10-s stop
# timeout. Each running crawl holds a PostgreSQL advisory lock (locks.py), so
# wait a limited time for them to finish; long imports are cut off and rerun on
# their next schedule.
- name: Check whether the database container is running
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --filter
      - "name=^/{{ oeds_db_container_name_effective }}$"
      - --filter
      - status=running
      - -q
  register: oeds_db_running
  changed_when: false
  failed_when: false

- name: Wait for running crawls to finish
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ oeds_db_container_name_effective }}"
      - psql
      - -U
      - "{{ oeds_db_user_effective }}"
      - -d
      - "{{ oeds_db_name_effective }}"
      - -tAc
      - >-
        SELECT count(*) FROM pg_locks l JOIN pg_stat_activity a ON a.pid = l.pid
        WHERE l.locktype = 'advisory' AND l.granted AND a.backend_type = 'client backend'
  register: oeds_running_crawls
  until: (oeds_running_crawls.stdout | trim) == "0"
  retries: "{{ (oeds_update_wait_for_crawls_minutes | default(15) | int) * 2 }}"
  delay: 30
  changed_when: false
  # After the wait the update goes on regardless.
  ignore_errors: true
  when:
    - oeds_enable_crawlers_effective | bool
    - (oeds_update_wait_for_crawls_minutes | default(15) | int) > 0
    - (oeds_db_running.stdout | default('') | trim) != ""

- name: Swap the staged source into place
  ansible.builtin.shell: |
    set -e
    rm -rf {{ (oeds_repo_dir_effective ~ '.prev') | quote }}
    if [ -e {{ oeds_repo_dir_effective | quote }} ]; then
      mv {{ oeds_repo_dir_effective | quote }} {{ (oeds_repo_dir_effective ~ '.prev') | quote }}
    fi
    mv {{ (oeds_repo_dir_effective ~ '.next') | quote }} {{ oeds_repo_dir_effective | quote }}
