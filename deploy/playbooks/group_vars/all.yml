---
# Defaults for all OEDS playbooks. Override them in group_vars/oeds.yml (not
# in Git), in the host's inventory entry or with -e; do not edit this file for
# one host. Do not store secrets in either file.

oeds_root: /open_energy_data_server
oeds_repo_dir: "{{ oeds_root }}/repo"
# Runtime files are kept outside the Git checkout.
oeds_runtime_dir: "{{ oeds_root }}/runtime"
# The oeds-kit checkout on the control node that is installed, including
# uncommitted changes (the installer passes its own clone).
oeds_repo_local_src: ""
# Crawler API keys copied to runtime/crawler/.env, optional.
oeds_crawler_env_file: ""

oeds_compose_project_name: oeds
oeds_compose_dir: "{{ oeds_repo_dir }}/deploy"
oeds_compose_files:
  - compose.yml
# docker compose with the selected files, run in oeds_compose_dir.
oeds_compose: >-
  docker compose
  {% for compose_file in oeds_compose_files %} -f {{ compose_file | quote }}{% endfor %}

# Persistent Docker volume data (TimescaleDB, Grafana, pgAdmin) AND Docker's own
# data-root (images, build cache, container logs) must live on a large, SEPARATE
# data partition, never on the small OS root filesystem. oeds_data_root is the
# mountpoint of that partition. On the KIT OEDS VMs this is /home (the large LVM
# volume); set it to wherever your data partition is mounted. On VMs with a
# single large partition, /home is simply part of it. The install aborts if the
# data paths are on a filesystem smaller than oeds_min_data_filesystem_gb,
# which protects small OS partitions.
oeds_data_root: /home
oeds_min_data_filesystem_gb: 200
oeds_data_dir: "{{ oeds_data_root }}/oeds/docker_data"
oeds_docker_data_root: "{{ oeds_data_root }}/docker"

# Database dump before an update, off by default (over 30 min for 140 GB); only
# the newest oeds_backup_keep remain. oeds-db-backup.yml writes here as well.
oeds_backup_before_update: false
oeds_backup_dir: "{{ oeds_data_root }}/oeds/backups"
oeds_backup_keep: 3
# Minutes an update waits for running crawls before it replaces the scheduler.
oeds_update_wait_for_crawls_minutes: 15
# Set true only after a prepared PostgreSQL major-version migration.
oeds_allow_pg_major_upgrade: false

oeds_db_container_name: open-data
oeds_db_name: opendata
oeds_db_user: opendata

# oeds-packages.yml: "latest" also updates the Docker packages.
oeds_package_state: present
oeds_docker_log_max_size: 10m
oeds_docker_log_max_file: "3"
oeds_docker_builder_keep_storage: 20GB

# oeds-uninstall.yml defaults are intentionally non-destructive.
oeds_uninstall_destroy_data: false
oeds_uninstall_remove_repo: false
oeds_uninstall_remove_runtime: false
oeds_uninstall_remove_backups: false
oeds_uninstall_remove_images: false
oeds_uninstall_confirm: ""

# oeds-rotate-passwords.yml host labels. Keep Bitwarden secrets in environment
# variables on the control node, not in a vars file.
oeds_rotation_deployment_name: "{{ inventory_hostname }}"
oeds_rotation_access_host: "{{ ansible_host | default(inventory_hostname) }}"
oeds_rotation_bitwarden_folder: "OEDS/{{ oeds_rotation_deployment_name }}"
oeds_rotation_password_length: 32
oeds_rotation_dry_run: false
