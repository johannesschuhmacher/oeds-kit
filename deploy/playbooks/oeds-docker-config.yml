- name: OEDS Docker config
  hosts: oeds
  become: true
  vars:
    oeds_default_root: /open_energy_data_server
    oeds_default_repo_url: https://github.com/johannesschuhmacher/oeds-deployment.git
    oeds_default_repo_version: main
    oeds_default_compose_project_name: oeds
    oeds_default_enable_crawlers: false
    oeds_default_repo_source_mode: git
    oeds_root_effective: "{{ oeds_root | default(oeds_default_root) }}"
    oeds_repo_dir_effective: "{{ oeds_repo_dir | default(oeds_root_effective ~ '/repo') }}"
    oeds_repo_source_dir_effective: "{{ oeds_repo_source_dir | default(oeds_root_effective ~ '/deployment-source') if oeds_repo_source_mode_effective == 'git' else oeds_repo_dir_effective }}"
    oeds_data_root_effective: "{{ oeds_data_root | default('/home') }}"
    oeds_data_dir_effective: "{{ oeds_data_dir | default(oeds_data_root_effective ~ '/oeds/docker_data') }}"
    oeds_docker_data_root_effective: "{{ oeds_docker_data_root | default(oeds_data_root_effective ~ '/docker') }}"
    oeds_min_data_filesystem_gb_effective: "{{ oeds_min_data_filesystem_gb | default(200) }}"
    oeds_runtime_dir_effective: "{{ oeds_runtime_dir | default(oeds_root_effective ~ '/runtime') }}"
    oeds_repo_url_effective: "{{ oeds_repo_url | default(oeds_default_repo_url) }}"
    oeds_repo_version_effective: "{{ oeds_repo_version | default(oeds_default_repo_version) }}"
    oeds_compose_project_name_effective: "{{ oeds_compose_project_name | default(oeds_default_compose_project_name) }}"
    oeds_enable_crawlers_effective: "{{ oeds_enable_crawlers | default(oeds_default_enable_crawlers) }}"
    oeds_repo_source_mode_effective: "{{ oeds_repo_source_mode | default(oeds_default_repo_source_mode) }}"
    oeds_repo_local_src_effective: "{{ oeds_repo_local_src | default('') }}"
    oeds_compose_dir_effective: "{{ oeds_compose_dir | default(oeds_repo_dir_effective ~ '/modular_repos/modules/oeds-deployment') }}"
    oeds_compose_files_effective: "{{ oeds_compose_files | default(['compose.yml']) }}"
    oeds_backup_before_update_effective: "{{ oeds_backup_before_update | default(true) }}"
    oeds_backup_dir_effective: "{{ oeds_backup_dir | default(oeds_data_root_effective ~ '/oeds/backups') }}"
    oeds_backup_keep_effective: "{{ oeds_backup_keep | default(3) }}"
    oeds_db_container_name_effective: "{{ oeds_db_container_name | default('open-data') }}"
    oeds_db_name_effective: "{{ oeds_db_name | default('opendata') }}"
    oeds_db_user_effective: "{{ oeds_db_user | default('opendata') }}"
    oeds_runtime_crawler_data_files:
      - crawler/data/mapping_eic_to_location.py
      - crawler/data/mapping_p_to_g.json
      - crawler/data/mapping_g_to_p.json
    oeds_persisted_volumes:
      - name: grafana-varlib
        mountpoint: "{{ oeds_data_dir_effective }}/grafana-varlib"
      - name: postgres-home
        mountpoint: "{{ oeds_data_dir_effective }}/postgres-home"
      - name: pgadmin-varlib
        mountpoint: "{{ oeds_data_dir_effective }}/pgadmin-varlib"
  tasks:
  - name: Measure the filesystems that will hold OEDS data
    # On a fresh install the data dirs do not exist yet and df needs an
    # existing path, so measure the nearest existing parent instead.
    ansible.builtin.shell: |
      p={{ item | quote }}
      while [ ! -e "$p" ]; do p=$(dirname "$p"); done
      df --output=size -BG "$p" | tail -1 | tr -dc '0-9'
    changed_when: false
    register: oeds_fs_size
    loop:
      - "{{ oeds_data_dir_effective }}"
      - "{{ oeds_docker_data_root_effective }}"
      - "{{ oeds_backup_dir_effective }}"
  - name: Refuse to place OEDS data on a filesystem that is too small
    ansible.builtin.assert:
      that:
        - item.stdout | int >= oeds_min_data_filesystem_gb_effective | int
      fail_msg: >-
        {{ item.item }} is on a filesystem of {{ item.stdout }} GB, smaller than
        oeds_min_data_filesystem_gb ({{ oeds_min_data_filesystem_gb_effective }} GB).
        Set oeds_data_root to a larger data partition, or lower
        oeds_min_data_filesystem_gb if this is intended.
      quiet: true
    loop: "{{ oeds_fs_size.results }}"
    loop_control:
      label: "{{ item.item }} ({{ item.stdout }} GB)"
  - name: Create OEDS directories
    ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      owner: root
      group: root
      mode: "0755"
    loop:
      - "{{ oeds_root_effective }}"
      - "{{ oeds_data_dir_effective }}"
      - "{{ oeds_runtime_dir_effective }}"
      - "{{ oeds_runtime_dir_effective }}/crawler"
      - "{{ oeds_runtime_dir_effective }}/crawler/data"
      - "{{ oeds_runtime_dir_effective }}/logs"
      - "{{ oeds_runtime_dir_effective }}/crawler_admin_state"
      - "{{ oeds_root_effective }}/backups"
  - name: Create writable runtime directories
    ansible.builtin.file:
      path: "{{ oeds_runtime_dir_effective }}/{{ item }}"
      state: directory
      owner: "1000"
      group: docker
      mode: "2775"
    loop:
      - crawler/data
      - logs
      - crawler_admin_state
  - name: Create persistent volume directories
    ansible.builtin.file:
      path: "{{ item.mountpoint }}"
      state: directory
      mode: "0755"
    loop: "{{ oeds_persisted_volumes }}"
  - name: Enroll Docker volumes without a third-party plugin
    community.docker.docker_volume:
      name: "{{ item.name }}"
      driver: local
      recreate: never
      driver_options:
        type: none
        o: bind
        device: "{{ item.mountpoint }}"
    loop: "{{ oeds_persisted_volumes }}"
  - name: Check that the selected source checkout exists
    ansible.builtin.stat:
      path: "{{ oeds_repo_source_dir_effective }}"
    register: oeds_repo_stat
  - name: Check whether a legacy compose project exists
    ansible.builtin.stat:
      path: "{{ oeds_root_effective }}/compose.yml"
    register: oeds_legacy_compose
  - name: Check whether the selected compose project exists
    ansible.builtin.stat:
      path: "{{ oeds_compose_dir_effective }}/{{ oeds_compose_files_effective[0] }}"
    register: oeds_selected_compose
  - name: Prepare repo source before any downtime
    ansible.builtin.import_tasks: tasks/oeds-repo-prepare.yml
  - name: Back up the database before any downtime
    ansible.builtin.import_tasks: tasks/oeds-db-backup-before-update.yml
  - name: Stop legacy compose project before switching to repo-root compose
    ansible.builtin.shell: docker compose down --remove-orphans
    args:
      chdir: "{{ oeds_root_effective }}"
    when: oeds_legacy_compose.stat.exists
  - name: Stop current compose project before updating repo
    ansible.builtin.shell: >-
      docker compose
      {% for compose_file in oeds_compose_files_effective %} -f {{ compose_file | quote }}{% endfor %}
      down --remove-orphans
    args:
      chdir: "{{ oeds_compose_dir_effective }}"
    when: oeds_selected_compose.stat.exists
  - name: Deploy repo content
    ansible.builtin.import_tasks: tasks/oeds-repo-deploy.yml
  - name: Seed static crawler data files into runtime mount
    ansible.builtin.copy:
      src: "{{ oeds_repo_dir_effective }}/{{ item }}"
      dest: "{{ oeds_runtime_dir_effective }}/crawler/data/{{ item | basename }}"
      remote_src: true
      owner: "1000"
      group: docker
      mode: "u=rw,g=rw,o=r"
    loop: "{{ oeds_runtime_crawler_data_files }}"
  - name: Seed runtime crawler config if it does not exist yet
    ansible.builtin.stat:
      path: "{{ oeds_runtime_dir_effective }}/CRAWLER_CONFIG.yml"
    register: oeds_runtime_config
  - name: Copy initial runtime crawler config from repo
    ansible.builtin.copy:
      src: "{{ oeds_repo_dir_effective }}/CRAWLER_CONFIG.yml"
      dest: "{{ oeds_runtime_dir_effective }}/CRAWLER_CONFIG.yml"
      remote_src: true
      owner: "1000"
      group: docker
      mode: "0660"
    when: not oeds_runtime_config.stat.exists
  - name: Check whether the runtime crawler env file exists
    ansible.builtin.stat:
      path: "{{ oeds_runtime_dir_effective }}/crawler/.env"
    register: oeds_runtime_env
  - name: Seed runtime crawler env file if it does not exist yet
    ansible.builtin.file:
      path: "{{ oeds_runtime_dir_effective }}/crawler/.env"
      state: touch
      owner: root
      group: docker
      mode: "0640"
    when: not oeds_runtime_env.stat.exists
  - name: Protect runtime crawler credentials for Docker operators
    ansible.builtin.file:
      path: "{{ oeds_runtime_dir_effective }}/crawler/.env"
      state: file
      owner: root
      group: docker
      mode: "0640"
  - name: Install supplied crawler credentials before services start
    ansible.builtin.copy:
      src: "{{ oeds_crawler_env_file }}"
      dest: "{{ oeds_runtime_dir_effective }}/crawler/.env"
      owner: root
      group: docker
      mode: "0640"
    no_log: true
    when: oeds_crawler_env_file | default('') | length > 0
  - name: Give runtime files to the container user
    ansible.builtin.import_tasks: tasks/oeds-runtime-permissions.yml
  - name: Restore Compose settings
    ansible.builtin.import_tasks: tasks/oeds-compose-env.yml
  - name: Check grafana directory
    ansible.builtin.file:
      path: "{{ oeds_data_dir_effective }}/grafana-varlib"
      owner: "472"
      group: "472"
      mode: "0750"
      state: directory
  - name: Run docker compose pull
    ansible.builtin.shell: >-
      docker compose
      {% for compose_file in oeds_compose_files_effective %} -f {{ compose_file | quote }}{% endfor %}
      pull
    args:
      chdir: "{{ oeds_compose_dir_effective }}"
  - name: Run docker compose up
    ansible.builtin.shell: >-
      docker compose
      {% for compose_file in oeds_compose_files_effective %} -f {{ compose_file | quote }}{% endfor %}
      {% if oeds_enable_crawlers_effective | bool %} --profile crawlers{% endif %}
      up -d
      {% if oeds_enable_crawlers_effective | bool %} --build{% endif %}
    args:
      chdir: "{{ oeds_compose_dir_effective }}"
  - name: Wait for PostgreSQL to become ready
    ansible.builtin.shell: >-
      docker compose
      {% for compose_file in oeds_compose_files_effective %} -f {{ compose_file | quote }}{% endfor %}
      exec -T open-data pg_isready -h 127.0.0.1 -U opendata -d opendata
    args:
      chdir: "{{ oeds_compose_dir_effective }}"
    register: oeds_pg_ready
    retries: 20
    delay: 15
    until: oeds_pg_ready.rc == 0
