- name: OEDS smoke test
  hosts: oeds
  become: true
  gather_facts: false
  vars:
    # Host ports as Compose publishes them, including port overrides in .env.
    oeds_smoke_services: "{{ (oeds_smoke_compose_config.stdout | from_json).services }}"
    oeds_smoke_db_port: "{{ oeds_smoke_services['open-data'].ports[0].published }}"
    oeds_smoke_postgrest_url: "http://127.0.0.1:{{ oeds_smoke_services['open-postgrest'].ports[0].published }}/"
    oeds_smoke_grafana_health_url: "http://127.0.0.1:{{ oeds_smoke_services['grafana'].ports[0].published }}/api/health"
    oeds_smoke_pgadmin_url: >-
      http://127.0.0.1:{{ (oeds_smoke_services['pgadmin'].ports | selectattr('target', 'equalto', 80) | first).published }}/
    oeds_smoke_crawler_admin_url: "http://127.0.0.1:{{ oeds_smoke_services['crawler-admin'].ports[0].published }}/admin"
  tasks:
    # The output holds the service passwords from .env.
    - name: Read the published ports from the Compose configuration
      ansible.builtin.shell: "{{ oeds_compose }} --profile crawlers config --format json"
      args:
        chdir: "{{ oeds_compose_dir }}"
      register: oeds_smoke_compose_config
      changed_when: false
      no_log: true

    - name: Wait until the PostgreSQL TCP port is reachable
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ oeds_smoke_db_port | int }}"
        timeout: 120

    - name: Check whether the database container is running
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --filter
          - "name=^/{{ oeds_db_container_name }}$"
          - --filter
          - status=running
          - -q
      register: oeds_smoke_db_container
      changed_when: false

    - name: Fail when the database container is not running
      ansible.builtin.fail:
        msg: "Container {{ oeds_db_container_name }} is not running."
      when: (oeds_smoke_db_container.stdout | trim) == ""

    - name: Query the PostgreSQL version
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ oeds_db_container_name }}"
          - psql
          - -U
          - "{{ oeds_db_user }}"
          - -d
          - "{{ oeds_db_name }}"
          - -tAc
          - SELECT version();
      register: oeds_smoke_pg_version
      changed_when: false

    - name: Query the non-system table count
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ oeds_db_container_name }}"
          - psql
          - -U
          - "{{ oeds_db_user }}"
          - -d
          - "{{ oeds_db_name }}"
          - -tAc
          - >-
            SELECT COUNT(*) FROM information_schema.tables
            WHERE table_schema NOT IN ('pg_catalog', 'information_schema');
      register: oeds_smoke_table_count
      changed_when: false

    - name: Check the PostgREST endpoint
      ansible.builtin.uri:
        url: "{{ oeds_smoke_postgrest_url }}"
        status_code: 200
        return_content: false
      register: oeds_smoke_postgrest
      retries: 24
      delay: 5
      until: oeds_smoke_postgrest.status == 200

    - name: Check the Grafana health endpoint
      ansible.builtin.uri:
        url: "{{ oeds_smoke_grafana_health_url }}"
        status_code: 200
        return_content: false
      register: oeds_smoke_grafana
      retries: 24
      delay: 5
      until: oeds_smoke_grafana.status == 200

    - name: Check the pgAdmin landing page
      ansible.builtin.uri:
        url: "{{ oeds_smoke_pgadmin_url }}"
        status_code:
          - 200
          - 302
        return_content: false
      register: oeds_smoke_pgadmin
      retries: 24
      delay: 5
      until: oeds_smoke_pgadmin.status in [200, 302]

    - name: Check the crawler admin UI
      ansible.builtin.uri:
        url: "{{ oeds_smoke_crawler_admin_url }}"
        status_code: 200
        return_content: false
      register: oeds_smoke_crawler_admin
      retries: 24
      delay: 5
      until: oeds_smoke_crawler_admin.status == 200

    # Runs the ninja crawler from the built scheduler image against a local
    # ZIP fixture (tests/integration.py), so a broken image fails here instead
    # of at the first scheduled crawl. Writes only the oeds_test_crawlers
    # schema, which is dropped again below.
    - name: Run the offline ninja crawler test in the scheduler image
      ansible.builtin.shell: >-
        {{ oeds_compose }} --profile crawlers run --rm --no-deps -T
        -v {{ (oeds_compose_dir ~ '/tests:/tests:ro') | quote }}
        scheduler python /tests/integration.py crawlers
      args:
        chdir: "{{ oeds_compose_dir }}"
      register: oeds_smoke_crawler_test

    - name: Drop the crawler test schema
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ oeds_db_container_name }}"
          - psql
          - -U
          - "{{ oeds_db_user }}"
          - -d
          - "{{ oeds_db_name }}"
          - -c
          - DROP SCHEMA IF EXISTS oeds_test_crawlers CASCADE;

    # Every scheduled run is an oeds-crawl subprocess; the command must find
    # the crawler pack's entry points and the core crawlers (20 + 21) in the image.
    - name: List the registered crawlers in the scheduler image
      ansible.builtin.shell: >-
        {{ oeds_compose }} --profile crawlers run --rm --no-deps -T
        scheduler oeds-crawl --list --config /app/CRAWLER_CONFIG.yml
      args:
        chdir: "{{ oeds_compose_dir }}"
      register: oeds_smoke_crawl_list
      changed_when: false
      failed_when: oeds_smoke_crawl_list.rc != 0 or (oeds_smoke_crawl_list.stdout_lines | length) < 40

    - name: Write the smoke test summary
      ansible.builtin.debug:
        msg:
          - "postgres={{ oeds_smoke_pg_version.stdout | trim }}"
          - "non_system_tables={{ oeds_smoke_table_count.stdout | trim }}"
          - "postgrest={{ oeds_smoke_postgrest_url }}"
          - "grafana={{ oeds_smoke_grafana_health_url }}"
          - "crawler_test={{ oeds_smoke_crawler_test.stdout_lines[-1] }}"
          - "registered_crawlers={{ oeds_smoke_crawl_list.stdout_lines | length }}"
