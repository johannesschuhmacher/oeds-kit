entsoe_fms:
  enable: false
  schema_name: entsoe_fms
  description: Crawls ENTSO-E FMS data (Transparency Platform File Library)
  default_start_date: '2014-01-01'
  post_run_scripts:
  - oeds-post gapfill entsoe-fms
  - oeds-post refresh entsoe-availability-map
  jobs:
    latest_hourly:
      enable: false
      schedule: 0 * * * *
      mode: fms_package_refresh
      fms_package_window_months: 1
      fms_package_write_mode: full_upsert
      run_post_scripts: true
      target_data_items:
      - ActualTotalLoad_6.1.A_r3
      - DayAheadTotalLoadForecast_6.1.B_r3
      - GenerationForecastsForWindAndSolar_14.1.D_r3
      - EnergyPrices_12.1.D_r3
      - ForecastedTransferCapacities_11.1_r3
      - PhysicalFlows_12.1.G_r3
    revision_sweep_daily:
      enable: false
      schedule: 30 2 * * *
      mode: fms_package_refresh
      fms_package_window_months: 3
      fms_package_write_mode: full_upsert
      run_post_scripts: true
      target_data_items:
      - ActualTotalLoad_6.1.A_r3
      - DayAheadTotalLoadForecast_6.1.B_r3
      - GenerationForecastsForWindAndSolar_14.1.D_r3
      - EnergyPrices_12.1.D_r3
      - ForecastedTransferCapacities_11.1_r3
      - PhysicalFlows_12.1.G_r3
  gapfill:
    enable: false
    target_schema: entsoe_fms_gapfilled
    method: donor_refined
    candidate_periods:
    - 24h
    - 7d
    donor_context_periods: 6
    donor_search_radius: 28d
    refinement_periods: 3
    max_gap_periods: 24
    lookback: 28d
    fail_on_table_error: true
    tables:
    - ActualTotalLoad
    - DayAheadTotalLoadForecast
    - GenerationForecastsForWindAndSolar
    - EnergyPrices
    - ForecastedTransferCapacities
    - PhysicalFlows
    table_methods:
      ActualTotalLoad: linear
      DayAheadTotalLoadForecast: donor_refined
      GenerationForecastsForWindAndSolar: donor_refined
      EnergyPrices: donor_refined
      ForecastedTransferCapacities: donor_refined
      PhysicalFlows: donor_refined
entsoe_api:
  enable: false
  schema_name: entsoe_api
  description: Crawls selected ENTSO-E Transparency Platform Web API time series
  schedule: 35 11 * * *
  post_run_scripts:
  - oeds-post forecast day-ahead-price
  country_code: DE_LU
  lookback_days: 14
  lookahead_days: 2
  request_pause_seconds: 0.5
  include_day_ahead_prices: true
  include_exaa_prices: true
  include_load_forecast: true
  include_wind_solar_forecast: true
  jobs:
    forecast_daily:
      enable: false
      schedule: 35 11 * * *
      lookback_days: 14
      lookahead_days: 2
      run_post_scripts: true
    training_bootstrap:
      enable: false
      schedule: 10 3 * * 0
      lookback_days: 120
      lookahead_days: 2
      run_post_scripts: false
