# Read the Docs build: https://open-energy-data-server-kit.readthedocs.io
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - pip install -r docs/requirements.txt
    - python -m sphinx -c docs -b html . $READTHEDOCS_OUTPUT/html
    # The start page is docs/index.html (the sources are the repository root).
    - echo '<meta http-equiv="refresh" content="0; url=docs/index.html">' > $READTHEDOCS_OUTPUT/html/index.html
